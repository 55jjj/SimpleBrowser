name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Generate project files
      run: |
        python3 -c "
import os, base64
files = {}
files['settings.gradle'] = ''
files['build.gradle'] = 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMi4wJyBhcHBseSBmYWxzZQp9Cg=='
files['gradle.properties'] = 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg=='
files['app/build.gradle'] = ''
files['app/proguard-rules.pro'] = 'IyBQcm9HdWFyZCBydWxlcwo='
files['app/src/main/AndroidManifest.xml'] = ''
files['app/src/main/java/com/example/simplebrowser/MainActivity.java'] = ''
files['app/src/main/res/layout/activity_main.xml'] = ''
files['app/src/main/res/values/strings.xml'] = 'PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPlNpbXBsZUJyb3dzZXI8L3N0cmluZz4KPC9yZXNvdXJjZXM+Cg=='
files['app/src/main/res/values/themes.xml'] = 'PHJlc291cmNlcz4KICAgIDxzdHlsZSBuYW1lPSJUaGVtZS5TaW1wbGVCcm93c2VyIiBwYXJlbnQ9IlRoZW1lLk1hdGVyaWFsMy5EYXlOaWdodC5Ob0FjdGlvbkJhciIgLz4KPC9yZXNvdXJjZXM+Cg=='
for path, b64 in files.items():
    dir_path = os.path.dirname(path)
    if dir_path:
        os.makedirs(dir_path, exist_ok=True)
    with open(path, "wb") as f:
        f.write(base64.b64decode(b64))
    print(f"Generated: {path}")
"
    - name: List generated files
      run: |
        ls -la
        ls -la app/src/main/java/com/example/simplebrowser/
        cat settings.gradle
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Create Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
